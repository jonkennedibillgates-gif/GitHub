<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starter App</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    main { text-align: center; padding: 16px; }
    button { font-size: 1.1rem; padding: 12px 28px; border: 0; border-radius: 8px; background: #1e61f0; color: #fff; cursor: pointer; }
    #status { margin-top: 16px; min-height: 1.5em; }
  </style>
  <script src="https://cdn.amplitude.com/script/2484ac31db270d1abe4e01a216658528.js"></script>
  <script>
    window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1, serverZone: 'US' }));
    window.amplitude.init('2484ac31db270d1abe4e01a216658528', {
      serverZone: 'US',
      autocapture: true,
    });
  </script>
</head>
<body>
  <main>
    <h1>Starter App</h1>
    <p>Press the button to get started.</p>
    <button id="get-started" type="button">Get Started</button>
    <div id="status" role="status"></div>
  </main>
  <script>
    document.getElementById('get-started').addEventListener('click', function () {
      window.amplitude.track('Get Started Clicked');
      document.getElementById('status').textContent = 'Welcome! You are all set.';
    });
  </script>
</body>
</html>
